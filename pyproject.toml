[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-router-proxy"
version = "0.1.0"
description = "OpenAI-compatible proxy with BERT-based task-aware model routing to optimal OpenRouter models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Kevin O'Connor", email = "kevin@kevinbytes.com"},
]
keywords = ["openai", "proxy", "llm", "router", "openrouter", "classifier"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
classifier = [
    "mlx>=0.22",
    "mlx-lm>=0.22",
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.44",
    "safetensors>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
smart-router-proxy = "smart_router_proxy.server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/smart_router_proxy"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
