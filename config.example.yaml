# smart-router-proxy — Example Configuration
#
# Copy to config.yaml (gitignored) or point SMART_ROUTER_PROXY_CONFIG at it.
# Secrets come from environment variables only — never put keys in this file.

server:
  host: 127.0.0.1
  port: 8199
  # Env var holding an optional bearer token clients must present.
  # Leave the env var unset to disable client auth (localhost-only setups).
  client_auth_env: SMART_ROUTER_PROXY_TOKEN

# Local BERT classifier (distilbert + MLX, ~5-15ms, ~87% accuracy).
# Model must be trained from github.com/KevinOBytes/prompt-classifier and
# copied to model_path. Without it, the proxy falls back to luna.
classifier:
  model_path: ~/.smart-router-proxy/classifier-model
  confidence_threshold: 0.45

# Upstream OpenAI-compatible API.
upstream:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  timeout_seconds: 600

# The model name clients request to get routing. Any other model name
# passes through to the upstream untouched.
virtual_model: smart-router

# mode: active (classify + route) or fixed (always fixed_alias)
mode: active
fixed_alias: luna

# Session pin TTL — requests with the same `user` field or X-Session-Id
# header keep their routed model this long.
session_ttl_seconds: 3600

# SQLite ledger: content-free usage accounting + persistent session pins.
# Holds token counts, cost, latency, model names, hashed session keys —
# never prompt or completion content.
store_path: ~/.smart-router-proxy/state.db

# Optional alias -> slug overrides (defaults come from hermes-smart-router)
aliases: {}
#  luna:
#    model_slug: openai/gpt-5.6-luna
