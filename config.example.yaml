# smart-router-proxy — Example Configuration
#
# Copy to config.yaml (gitignored) or point SMART_ROUTER_PROXY_CONFIG at it.
# Secrets come from environment variables only — never put keys in this file.

server:
  host: 127.0.0.1
  port: 8199
  # Env var holding an optional bearer token clients must present.
  # Leave the env var unset to disable client auth (localhost-only setups).
  client_auth_env: SMART_ROUTER_PROXY_TOKEN

# Local BERT classifier (distilbert + MLX, ~5-15ms, ~87% accuracy).
# The complete model bundle (DistilBERT base + trained classifier head) is
# downloaded and verified by ./install.sh from the pinned GitHub Release
# asset listed in models/manifest.json. After install, inference is fully
# offline — no Hugging Face download at runtime.
classifier:
  model_path: ~/.smart-router-proxy/classifier-model
  confidence_threshold: 0.45

# Upstream OpenAI-compatible API.
upstream:
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  timeout_seconds: 600

# The model name clients request to get routing. Any other model name
# passes through to the upstream untouched.
virtual_model: smart-router

# mode: active (classify + route) or fixed (always route to fixed_slug).
mode: active

# Fixed mode routes every request to this concrete destination:
# provider (openrouter | ollama) + model slug/name.
fixed_provider: openrouter
fixed_slug: openai/gpt-5.6-luna

# Session pin TTL — requests with the same `user` field or X-Session-Id
# header keep their routed model this long.
session_ttl_seconds: 3600

# SQLite ledger: content-free usage accounting + persistent session pins.
# Holds token counts, cost, latency, model names, hashed session keys —
# never prompt or completion content.
store_path: ~/.smart-router-proxy/state.db

# Prepend a visible routing tag ([category :: model]) to assistant content.
# Off by default — set true to see the classification + model per reply.
annotate_response: false

# Per-task-class concrete destination overrides (managed by the control
# panel). Each entry maps a task class to primary/fallback destination:
#   software_engineering:
#     primary: {provider: openrouter, model: z-ai/glm-5.2}
#     fallback: {provider: openrouter, model: anthropic/claude-opus-5}
route_overrides: {}
